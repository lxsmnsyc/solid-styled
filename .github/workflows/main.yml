name: CI
on:
  push:
    branches:
      - main
    # Roadmaps, debates, proposals and decisions are not build inputs.
    paths-ignore:
      - 'docs/**'
  pull_request:
    # A draft runs nothing. Pull requests stay drafts until their review is clean,
    # so CI runs once as the last gate before the merge.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'

# A new push to a pull request cancels the run of the push before it.
# Runs on pushes are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
          run_install: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Clean
        run: pnpm recursive run clean
        env:
          CI: true

      - name: Build
        run: pnpm recursive run build
        env:
          CI: true

      - name: Begin Tests
        run: pnpm recursive run test
        env:
          CI: true
